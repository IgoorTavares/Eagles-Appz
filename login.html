<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Entrar · Eagles Labz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5fd436">
<link rel="icon" href="assets/favicon-login-alert.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script>(function(){try{var t=localStorage.getItem('eagles_tema')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  .login-page { min-height: 100vh; display: flex; }
  .login-lado-ilustracao {
    flex: 1.15;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 56px;
    background: var(--bg-soft);
  }
  .login-lado-form {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    background: var(--bg);
    min-width: 340px;
  }
  .login-headline {
    font-size: 40px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.5px;
    color: var(--text);
    margin: 28px 0 12px;
  }
  .login-headline .destaque { color: var(--blue-strong); }
  .login-sub { font-size: 15px; color: var(--text-soft); max-width: 420px; margin: 0; }
  .login-ilustracao-wrap { max-width: 460px; }
  @media (max-width: 860px) {
    .login-page { flex-direction: column; }
    .login-lado-ilustracao { padding: 32px 24px 8px; text-align: center; }
    .login-ilustracao-wrap { max-width: 300px; margin: 0 auto; }
    .login-headline { font-size: 28px; }
    .login-sub { margin: 0 auto; }
    .login-lado-form { min-width: 0; }
  }
</style>
</head>
<body>
<div id="offline-banner" class="offline-banner"><svg style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;" viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg> Sem conexão — trabalhando offline.</div>

<div class="login-page">

  <div class="login-lado-ilustracao">
    <div class="login-ilustracao-wrap">
      <svg viewBox="0 0 480 420" style="width:100%; height:auto;" aria-hidden="true">
        <circle cx="60" cy="46" r="24" fill="var(--blue-tint)"/>
        <path d="M60 40a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" fill="none" stroke="var(--blue-strong)" stroke-width="2.5"/>
        <path d="M46 58c0-8 6-13 14-13s14 5 14 13" fill="none" stroke="var(--blue-strong)" stroke-width="2.5" stroke-linecap="round"/>

        <rect x="40" y="60" width="340" height="260" rx="18" fill="var(--bg-elevated)" stroke="var(--border)" stroke-width="1.5"/>
        <circle cx="64" cy="84" r="5" fill="var(--danger)" opacity="0.5"/>
        <circle cx="82" cy="84" r="5" fill="var(--warning)" opacity="0.6"/>
        <circle cx="100" cy="84" r="5" fill="var(--success)" opacity="0.6"/>
        <line x1="40" y1="102" x2="380" y2="102" stroke="var(--border)" stroke-width="1.5"/>

        <rect x="80" y="230" width="36" height="60" rx="6" fill="var(--blue-strong)" opacity="0.35"/>
        <rect x="140" y="190" width="36" height="100" rx="6" fill="var(--blue-strong)" opacity="0.55"/>
        <rect x="200" y="210" width="36" height="80" rx="6" fill="var(--blue-strong)" opacity="0.75"/>
        <rect x="260" y="160" width="36" height="130" rx="6" fill="var(--blue-strong)"/>

        <polyline points="98,200 158,165 218,185 278,125" fill="none" stroke="var(--blue-strong)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="98" cy="200" r="5" fill="var(--bg-elevated)" stroke="var(--blue-strong)" stroke-width="3"/>
        <circle cx="158" cy="165" r="5" fill="var(--bg-elevated)" stroke="var(--blue-strong)" stroke-width="3"/>
        <circle cx="218" cy="185" r="5" fill="var(--bg-elevated)" stroke="var(--blue-strong)" stroke-width="3"/>
        <circle cx="278" cy="125" r="5" fill="var(--bg-elevated)" stroke="var(--blue-strong)" stroke-width="3"/>

        <rect x="330" y="130" width="130" height="66" rx="16" fill="var(--bg-elevated)" stroke="var(--border)" stroke-width="1.5" style="filter:drop-shadow(0 8px 18px rgba(0,0,0,0.12));"/>
        <circle cx="358" cy="163" r="16" fill="var(--success-tint)"/>
        <path d="M351 163l5 5 10-10" fill="none" stroke="var(--success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="382" y="159" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="var(--text)">Pedido pago</text>
        <text x="382" y="175" font-family="Inter, sans-serif" font-size="11" fill="var(--text-soft)">R$ 1.580,00</text>

        <circle cx="66" cy="320" r="42" fill="var(--blue-strong)" style="filter:drop-shadow(0 10px 20px rgba(0,0,0,0.15));"/>
        <text x="66" y="326" font-family="Inter, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">R$</text>
      </svg>
    </div>
    <h1 class="login-headline">Organize as <span class="destaque">vendas</span> que sua empresa faz.</h1>
    <p class="login-sub">Clientes, produtos, pedidos e financeiro num só lugar — cada empresa com os próprios dados, separados e seguros.</p>
  </div>

  <div class="login-lado-form">
    <div class="panel" style="width:100%; max-width:380px;">
      <div style="display:flex; justify-content:center; margin-bottom:10px;">
        <img src="assets/logo-full.png" alt="Eagles Labz" style="width:100%; max-width:200px; height:auto;">
      </div>
      <p style="text-align:center; color:var(--text-soft); font-size:13px; margin-top:0; margin-bottom:24px;">Entre com seu e-mail e senha</p>

      <form id="form-login">
        <div class="field full" style="margin-bottom:14px;">
          <label>E-mail</label>
          <input type="email" id="login-email" required placeholder="seuemail@exemplo.com" autocomplete="username">
        </div>
        <div class="field full">
          <label>Senha</label>
          <input type="password" id="login-senha" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <p id="login-erro" style="color:var(--danger); font-size:13px; display:none; margin:12px 0 0;"></p>
        <p id="login-info" style="color:var(--success); font-size:13px; display:none; margin:12px 0 0;"></p>
        <button type="submit" class="btn btn-primary" id="btn-login" style="width:100%; justify-content:center; margin-top:18px;">Entrar</button>
        <button type="button" id="btn-esqueci-senha" onclick="recuperarSenha()" style="width:100%; text-align:center; background:none; border:none; color:var(--text-soft); font-size:13px; margin-top:14px; cursor:pointer; text-decoration:underline; font-family:inherit;">Esqueceu a senha?</button>
      </form>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>
<script>
initFirebase();
bloquearZoomMobile();

if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length) {
  firebase.auth().onAuthStateChanged((user) => {
    if (user) window.location.href = 'index.html';
  });
}

document.getElementById('form-login').addEventListener('submit', function (e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const erroEl = document.getElementById('login-erro');
  const infoEl = document.getElementById('login-info');
  const btn = document.getElementById('btn-login');
  erroEl.style.display = 'none';
  infoEl.style.display = 'none';

  if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length) {
    erroEl.textContent = 'Login indisponível: configure o Firebase primeiro (firebase-config.js).';
    erroEl.style.display = '';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Entrando...';
  firebase.auth().signInWithEmailAndPassword(email, senha)
    .then(() => { window.location.href = 'index.html'; })
    .catch((err) => {
      erroEl.textContent = mensagemErroLogin(err.code);
      erroEl.style.display = '';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    });
});

function recuperarSenha() {
  const erroEl = document.getElementById('login-erro');
  const infoEl = document.getElementById('login-info');
  erroEl.style.display = 'none';
  infoEl.style.display = 'none';

  const email = document.getElementById('login-email').value.trim();
  if (!email) {
    erroEl.textContent = 'Digite seu e-mail no campo acima primeiro, depois clique em "Esqueceu a senha?" de novo.';
    erroEl.style.display = '';
    return;
  }
  if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length) {
    erroEl.textContent = 'Recuperação indisponível: configure o Firebase primeiro.';
    erroEl.style.display = '';
    return;
  }

  const btn = document.getElementById('btn-esqueci-senha');
  btn.disabled = true;
  firebase.auth().sendPasswordResetEmail(email)
    .then(() => {
      infoEl.textContent = 'Enviamos um link pra esse e-mail — abra e siga as instruções pra criar uma senha nova.';
      infoEl.style.display = '';
    })
    .catch((err) => {
      erroEl.textContent = mensagemErroLogin(err.code);
      erroEl.style.display = '';
    })
    .finally(() => { btn.disabled = false; });
}
</script>
</body>
</html>
