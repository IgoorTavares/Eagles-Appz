name: Testes de várias pessoas ao mesmo tempo
# Navegadores reais (Playwright) + simulador do Firebase com o firestore.rules
# real. Nada aqui fala com o Firebase de produção nem publica o site.
on:
  push:
    paths: ['script.js', 'firestore.rules', 'crm.html', 'testes-concorrencia/**', '.github/workflows/concorrencia.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concorrencia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # os testes comparam com a v155 (commit a340d03)
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install -g firebase-tools@13
      - run: cd testes-concorrencia && npm ci
      - run: cd testes-concorrencia && npx playwright install --with-deps chromium
      - run: cd testes-concorrencia && npm run simulador
