name: Testes das regras do banco
on:
  push:
    paths: ['firestore.rules', 'testes-regras/**', '.github/workflows/regras.yml']
  workflow_dispatch:
jobs:
  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install -g firebase-tools
      - run: cd testes-regras && npm install
      - run: firebase emulators:exec --only firestore --project demo-eagles "cd testes-regras && npm test"
