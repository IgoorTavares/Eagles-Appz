<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tarefas do dia · Eagles Labz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3fae12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tarefas do dia">
<link rel="icon" href="assets/favicon-eagles.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script>(function(){try{var r=document.documentElement,a=JSON.parse(localStorage.getItem('eagles_tema_aplicado_v1')||'null');if(a&&a.modo){r.setAttribute('data-theme',a.modo);if(a.custom&&a.vars){r.setAttribute('data-tema-custom','');for(var k in a.vars){if(k.indexOf('--')===0)r.style.setProperty(k,a.vars[k]);}}}else{r.setAttribute('data-theme',localStorage.getItem('eagles_tema')||'light');}}catch(e){}})();</script>
</head>
<body class="tt-pagina">
<div id="auth-loading" class="auth-loading-screen"><img src="assets/logo-full.png" alt="Eagles Labz" class="auth-loading-logo"><div class="auth-loading-text">Carregando...</div></div>
<main class="tt" id="tt-app"><p class="kb-vazio">Carregando...</p></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>
<script>
aplicarTemaSalvo();
initFirebase();
protegerPagina(function () { if (!protegerPaginaPorPlano('crm')) return; ttIniciar(); });
</script>
<div class="modal-overlay" id="modal-aviso-sistema">
  <div class="modal crm-modal-aviso">
    <div class="modal-header"><h2 id="aviso-sistema-titulo">Confirmar</h2></div>
    <p id="aviso-sistema-mensagem" style="color:var(--text-soft); white-space:pre-wrap;"></p>
    <div class="modal-actions">
      <button type="button" class="btn" id="aviso-sistema-btn-cancelar" onclick="fecharAvisoSistema(false)">Cancelar</button>
      <button type="button" class="btn btn-primary" id="aviso-sistema-btn-ok" onclick="fecharAvisoSistema(true)">OK</button>
    </div>
  </div>
</div>
</body>
</html>
