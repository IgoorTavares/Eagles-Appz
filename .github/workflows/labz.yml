name: Testes da LABZ AI (backend)
on:
  push:
    paths: ['functions-labz/**', '.github/workflows/labz.yml']
  workflow_dispatch:
jobs:
  labz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd functions-labz && npm test
